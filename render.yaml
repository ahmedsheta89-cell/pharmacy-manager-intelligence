# Render Blueprint للتجربة الخارجية فقط. لا يعرّف قاعدة بيانات Render لأن التطبيق
# يستخدم Drizzle/MySQL؛ أدخل DATABASE_URL الخاص بـTiDB Cloud من لوحة Render.
services:
  - type: web
    name: pharmacy-manager-intelligence
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /healthz
    maxShutdownDelaySeconds: 30
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: VITE_APP_ID
        sync: false
      - key: OAUTH_SERVER_URL
        sync: false
      - key: VITE_OAUTH_PORTAL_URL
        sync: false
      - key: OWNER_OPEN_ID
        sync: false
