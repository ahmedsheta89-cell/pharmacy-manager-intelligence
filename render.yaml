# Render Blueprint للتجربة الخارجية فقط. لا يعرّف قاعدة بيانات Render لأن التطبيق
# يستخدم Drizzle/MySQL؛ أدخل DATABASE_URL الخاص بـTiDB Cloud من لوحة Render.
services:
  - type: web
    name: pharmacy-manager-intelligence
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: node dist/index.js
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    initialDeployHook: pnpm exec drizzle-kit migrate; pnpm db:bootstrap:external -- --apply
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEPLOYMENT_TARGET
        value: external
      - key: VITE_DEPLOYMENT_TARGET
        value: external
      - key: EXTERNAL_DB_EXPECTED_SCHEMA
        value: test
      - key: EXTERNAL_DB_APPLY_CONFIRMATION
        value: APPLY_TIDB_TEST_SCHEMA_V1
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_TIDB_TEST
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: AUTH_BOOTSTRAP_ADMIN_EMAIL
        sync: false