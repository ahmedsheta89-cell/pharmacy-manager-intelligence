# Render Blueprint للتجربة الخارجية فقط. لا يعرّف قاعدة بيانات Render لأن التطبيق
# يستخدم Drizzle/MySQL؛ أدخل DATABASE_URL الخاص بـTiDB Cloud من لوحة Render.
services:
  - type: web
    name: pharmacy-manager-intelligence
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /healthz
    maxShutdownDelaySeconds: 30
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      # يمنع بدء خدمة عامة قبل اعتماد هوية خارجية حقيقية.
      - key: DEPLOYMENT_TARGET
        value: external
      - key: VITE_DEPLOYMENT_TARGET
        value: external
      # تُدخل من لوحة Render الآمنة بعد تحقق TiDB وSupabase؛ لا توجد قيم في المستودع.
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: AUTH_BOOTSTRAP_ADMIN_EMAIL
        sync: false
